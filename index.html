<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123a38">
  <title>伊比利亚光影纪行｜移动路书</title>
  <link rel="preload" as="image" href="assets/images/cover.jpg" fetchpriority="high">
  <link rel="preconnect" href="https://api.mapbox.com">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="v6.6-overrides.css">
  <link rel="stylesheet" href="v6.7-overrides.css">
  <link rel="stylesheet" href="v6.8-overrides.css">
  <link rel="stylesheet" href="v7.0-overrides.css">
  <link rel="stylesheet" href="v7.1-overrides.css">
  <link rel="stylesheet" href="v7.2-overrides.css">
  <link rel="stylesheet" href="v7.4-overrides.css">
</head>
<body>
  <div class="preload-screen" id="preloadScreen" role="status" aria-live="polite" aria-label="正在加载旅行路书">
    <div class="preload-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <p>正在装载旅行画册</p>
    <b id="preloadProgress">0 / 48</b>
  </div>
  <div class="mobile-shell">
    <header class="topbar" id="topbar"></header>
    <main id="app" aria-live="polite"></main>
    <nav class="tabbar" aria-label="主导航" id="tabbar"></nav>
  </div>

  <dialog class="detail-sheet" id="detailSheet">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="sheet-close" data-close-sheet aria-label="关闭详情"><i data-lucide="x"></i></button>
    <div id="sheetContent"></div>
  </dialog>

  <dialog class="image-lightbox" id="imageLightbox" aria-label="图片放大预览">
    <button class="image-lightbox-close" data-close-image-preview aria-label="关闭图片预览"><i data-lucide="x"></i></button>
    <figure class="image-lightbox-stage">
      <img id="imageLightboxImage" alt="">
      <figcaption id="imageLightboxCaption"></figcaption>
    </figure>
  </dialog>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
